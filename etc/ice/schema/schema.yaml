name: ice
version: 1
description: ICE workflow - explore, intent, proposal, specs, design, expectations, tasks
artifacts:
  - id: intent
    generates: intent.md
    description: The owner's intent, reached through exploration and confirmed by the owner
    template: intent.md
    instruction: |
      Write the intent: what the owner wants, from the caller's side, before
      anything about how.

      Order, and no step starts before the one above it ends:
      1. Explore first (opsx explore). Read the code at the places the change
         will touch, the specs under openspec/specs, CONTEXT.md and lat.md.
      2. Settle by probe or prototype whatever running something can answer.
         Run it; do not ask the owner a question the machine can answer.
      3. Draft every section of intent.md. Check each term against CONTEXT.md
         when the repo has one, and use its words.
      4. Run the gap detector: a separate read-only session under the gaps
         preset (SPC a k G in Emacs) reads intent.md and the repo and writes
         gaps.md beside it. Do not detect the gaps yourself in this session.
         If you cannot start that session, stop, ask the owner to run it,
         and wait for gaps.md.
      5. Settle every gaps.md item marked "settle by probe/prototype" by
         running it. Ask the owner only the "ask owner" items still open, all
         at once, in one message, each with its default. When gaps.md says
         none are open, ask nothing.
      6. Fold the answers into intent.md.
      7. Restate the intent in your own words, in a few lines, under
         Restated, and say it to the owner. Wait. If the owner corrects you,
         fix intent.md and restate again.

      Never, whatever the owner seems to have said:
      - write, fill, change or delete the Confirmed line under Restated. The
        owner sets it (ygg-ice-confirm-intent, SPC a k R) and nobody else;
        the gate reads it as the owner's word;
      - take a reply in chat as that confirmation, or start proposal.md
        before ice-check intent passes.
      If the owner asks you to write the line, stop and point them at the
      command. Stopping there is not failing the task.

      Sections, each with real content:
      - What is wanted: the outcome, independent of technology.
      - Caller's view: what the person or program calling this sees and does,
        start to finish.
      - Constraints: limits the solution must respect.
      - Failure scenarios: what must not happen, and what a failure looks like
        to the caller.
      - Success scenarios: what the caller sees when it works.
      - Connections: other intents, features and changes this touches. Name
        the feature map section as a line "Feature: <name>"; the archive step
        files the change under it in lat.md.
      - Out of scope: what this change will not do.
      - Alternatives refused: at least one list item, each an approach
        considered and the reason it was refused.
      - Restated: the intent in your own words, a few lines, the caller's
        view first. The Confirmed line below it is the owner's.

      Expectations are not written here. They come next, in expectations.md,
      once the owner has confirmed this intent.

      Check with: ice-check intent <change-dir>
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.
      Build on the owner-confirmed intent.md; link to it rather than restate it,
      and do not start until ice-check intent passes, which needs the owner's
      Confirmed line under Restated.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new specs/<capability-path>/spec.md. Use kebab-case for path segments you introduce (e.g., user-auth or identity/user-auth) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under openspec/specs/. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run openspec list --specs for the project's capability inventory, then
      openspec show "<spec-id>" --type spec --json --no-scenarios for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append --store "<id>" to
      both commands only for a registered standalone store, and keep --type
      spec: a change and a spec sharing a name is otherwise an ambiguous-item
      error. openspec list without --specs lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with openspec show "<spec-id>" --type spec (same --store rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: openspec validate rejects a
      change with zero deltas unless the change's .openspec.yaml sets
      skip_specs: true. Use skip_specs: true only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires:
      - intent

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      <capability-path> is the spec directory relative to specs/ (for example,
      user-auth or identity/user-auth). Preserve the full path:
      - New capabilities: use the exact path from the proposal at specs/<capability-path>/spec.md. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from openspec/specs/<capability-path>/ when creating the delta at specs/<capability-path>/spec.md. Run openspec list --specs to confirm that path before writing the delta, appending --store "<id>" only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's .openspec.yaml
      sets skip_specs: true (no spec-level behavior change) - openspec validate
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and skip_specs is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: ### Requirement: <name> followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: #### Scenario: <name> with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (####). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: the delta spec's first section is ## Purpose -
      one or two sentences (50+ characters, or openspec validate --strict
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a TBD ... Update Purpose after archive placeholder to fill in
      by hand. Do NOT add ## Purpose to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover TBD placeholder -
      edit <planningHome.root>/openspec/specs/<capability-path>/spec.md
      directly. planningHome.root comes from the openspec instructions ...
      --json response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from --store, a project store: pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in <planningHome.root>/openspec/specs/<capability-path>/spec.md (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from ### Requirement: through all scenarios)
      3. Paste under ## MODIFIED Requirements and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is ## Purpose):
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal


  - id: expectations
    generates: expectations.md
    description: The contract and owner-confirmed Given/When/Then scenarios, each with the check it becomes
    template: expectations.md
    instruction: |
      Load the ice-checks skill and follow it; this artifact is its output.
      Write the expectations only after exploration and a confirmed intent.
      Checks written before exploring guess at seams and behaviour that the
      exploration would have shown.

      1. Contract first, under "## Contract", for each unit the change
         touches: Pre-conditions, Post-conditions (return value, the error
         for each bad input, state changed, side effects), Undefined inputs
         (what the spec leaves open, so nobody tests it) and Laws (roundtrip,
         reference model, invariants and the like, when the contract states
         one). Mark each line tested or untested.
      2. Then one section per untested contract line, headed
         "## Scenario: <id> <name>", where the id is capability#slug (for
         example cart#promo-before-tax). Each has one GIVEN, one WHEN and
         one THEN line, taken from the intent's success and failure
         scenarios and the spec deltas.
      3. Expected values come from the intent, the contract, the spec
         deltas or a named reference, never from running or reading the code
         under change. When that code may be wrong, a fresh subagent that
         sees only the intent, the contract and the public interface writes
         the checks.
      4. Agree the seam with the owner first: the highest one that can
         observe the behaviour, ideally one. Name it on the "Seam:" line.
      5. "Check:" names the test or command that proves the scenario, and
         the check's name carries the scenario id. Add one property check
         per law. Each new check must fail on the base commit.
      6. Show the contract and scenarios to the owner and wait for
         confirmation. From then on this file belongs to the owner: the
         building agent never edits it or bends a check to pass. If a check
         contradicts the confirmed intent, stop, name the check, quote the
         intent line, and hand it to the owner.

      Check with: ice-check expect <change-dir>
    requires:
      - intent
      - specs

  - id: tasks
    generates: tasks.md
    description: Minimal plan of tracer-bullet slices, each with its evidence
    template: tasks.md
    instruction: |
      Write the minimal plan: numbered tracer-bullet slices, each a thin
      vertical cut through every layer that one fresh context can finish.
      Wide refactors run as expand, migrate, contract.

      Each slice is one checkbox line, "- [ ] N. <slice>", followed by
      indented fields:
      - Blocked by: the slice numbers it waits on, or none.
      - Files: the files it touches.
      - Scenario: the expectations.md scenario it satisfies.
      - Pass when: the observable condition, a command and its result.
      - Evidence: the path where the proof lands (test output, log, capture).

      Only the checkbox line is tracked; keep fields on indented lines below
      it. Tick a slice only after its Pass when holds and its Evidence exists.
      No prose sections, no groups, no restated design.

      Check with: ice-check plan <change-dir> (it also requires expect to pass)
    requires:
      - expectations
      - design

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Work the slices in tasks.md in blocking order, one fresh context each.
    Read intent.md and expectations.md first; never edit expectations.md.
    Tick a slice only after its Pass when holds and its Evidence file exists.
    If a check looks wrong, stop and flag it to the owner; do not change it.
    Pause if you hit blockers or need clarification.
